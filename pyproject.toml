[build-system]
requires = ["setuptools>=63.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olivos-plugin-MammonRoulette"
version = "2.19.0-alpha"
description = "權衡風險與收益：是孤注一擲，還是步步爲營? 生死之間唯有膽識與策略並存的惡鬼得以幸存."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "恋倾雨", email = "xinghu2408@foxmail.com"},
]
license = {text = "AGPLv3 License"}
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "olivos",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<9",
    "pytest-cov>=5,<7",
]

[project.urls]
Repository = "https://github.com/lianqingyuYuri/OlivaDice-MammonRoulette"
Issues = "https://github.com/lianqingyuYuri/OlivaDice-MammonRoulette/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["MammonRoulette"]
omit = ["MammonRoulette/GUI.py"]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "test-results/html"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["BLE001", "E203", "I001", "N999", "PLR1711", "RUF010", "SIM102", "UP004", "UP009"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
